<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Timeline Sample</title>
    <style>
        :root {
            --bg: #fbfbfb;
            --fg: #111;
            --line: #dcdcdc;
            --accent: #0022aa;
            --muted: #777;
            --major: #e6e6e6
        }

        body.dark {
            --bg: #1b1b1b;
            --fg: #f0f0f0;
            --line: #383838;
            --accent: #5d82ff;
            --muted: #aaa;
            --major: #3a3a3a
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            min-width: 320px
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 76px;
            background: var(--bg);
            border-bottom: 1px solid var(--fg);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .nav {
            display: flex;
            gap: 5px;
            align-items: stretch;
            height: 100%
        }

        .nav-item {
            padding: 0 17px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            cursor: pointer
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--fg);
            color: var(--bg)
        }

        .nav-jp {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap
        }

        .nav-en {
            font: 10px "Courier New", monospace;
            letter-spacing: 1px;
            color: #777
        }

        .nav-item:hover .nav-en,
        .nav-item.active .nav-en {
            color: var(--bg)
        }

        .mode {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            border: 1px solid var(--fg);
            background: transparent;
            color: var(--fg);
            padding: 5px 12px;
            font: 11px "Courier New", monospace;
            cursor: pointer
        }

        .hero {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 32px 55px;
            text-align: center
        }

        .kicker {
            font: 11px "Courier New", monospace;
            letter-spacing: 3px;
            color: var(--muted)
        }

        .hero h1 {
            margin-top: 13px;
            font-size: clamp(28px, 4vw, 48px);
            letter-spacing: .08em;
            font-weight: 900
        }

        .hero p {
            margin-top: 15px;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: .08em
        }

        /* 优化点1与2：去除顶部padding，使得线条起点可控；加粗实心线条宽度至 12px */
        .timeline {
            position: relative;
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 28px 140px; 
        }

        .timeline::before {
            content: "";
            position: absolute;
            top: 27px; /* 精准定位，27px刚好是第一个年代标签54px高度的中心，不再超出 */
            bottom: 0;
            left: 50%;
            width: 12px; /* 加粗倍数 */
            transform: translateX(-50%);
            background: var(--line); 
            border-radius: 6px;
        }

        .decade {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 35px 0 28px;
            height: 54px
        }

        /* 优化点1补充：首个年代标签去顶外边距，配合 ::before 的 top 属性完美覆盖线头 */
        .decade:first-child {
            margin-top: 0;
        }

        .decade::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--line)
        }

        /* 优化点5：年份默认为 #7a7a7a */
        .decade span {
            position: relative;
            background: var(--bg);
            padding: 0 20px;
            font: 700 25px/1 "Courier New", monospace;
            letter-spacing: 1px;
            color: #7a7a7a; 
        }

        /* 优化点3：缩窄中间通道宽度 (从 70px 缩为 30px) */
        .row {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 30px 1fr;
            align-items: center;
            min-height: 145px;
            margin: 8px 0
        }

        .side {
            min-width: 0
        }

        /* 优化点3：减少文字块的两侧空隙，靠中心节点更近 */
        .left {
            padding-right: 15px; 
            text-align: right
        }

        .right {
            padding-left: 15px;
            text-align: left
        }

        .empty {
            visibility: hidden
        }

        .connector {
            position: absolute;
            top: 50%;
            height: 2px; /* 为了匹配中间加粗的竖线，横线也稍微加粗到 2px */
            background: var(--fg);
            z-index: 2
        }

        /* 优化点3：匹配缩小的通道距，重调连接线宽度 */
        .left+.node+.side.right+.connector {
            right: 50%;
            width: 15px
        }

        .left.empty+.node+.side.right+.connector {
            left: 50%;
            width: 15px
        }

        .node {
            position: relative;
            z-index: 4;
            width: 20px;
            height: 20px;
            border: 2px solid var(--fg);
            border-radius: 50%;
            background: var(--bg);
            margin: auto
        }

        .event {
            display: inline-block;
            max-width: 430px;
            padding: 9px 0
        }

        .event-date {
            font: 700 13px/1.2 "Courier New", monospace;
            color: var(--accent);
            margin-bottom: 7px
        }

        .event-title {
            display: inline;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            background: var(--fg);
            color: var(--bg);
            font-size: 18px;
            font-weight: 900;
            line-height: 1.55;
            padding: 2px 8px
        }

        .event-desc {
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.8;
            color: var(--fg)
        }

        /* 图片样式调整，自适应真实图片并允许居中题注 */
        .event-image {
            margin-top: 14px;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            background: var(--bg);
        }

        .event-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 大背景字，采用传入的 date 数据 */
        .major .event::after {
            content: attr(data-year);
            position: absolute;
            z-index: -1;
            font: 900 92px/1 Impact, "Arial Black", sans-serif;
            color: var(--major);
            white-space: nowrap;
            pointer-events: none
        }

        .left .event::after {
            right: 0;
            top: -5px
        }

        .right .event::after {
            left: 0;
            top: -5px
        }

        .footer {
            border-top: 1px solid var(--fg);
            padding: 35px;
            text-align: center;
            font: 10px "Courier New", monospace;
            color: var(--muted)
        }

        @media(max-width:700px) {
            .header {
                height: 60px;
                justify-content: flex-start;
                overflow: auto
            }

            .nav {
                padding-left: 10px
            }

            .nav-item {
                padding: 0 9px
            }

            .mode {
                display: none
            }

            .hero {
                padding: 55px 20px 35px
            }

            .timeline {
                padding-left: 14px;
                padding-right: 14px
            }

            .timeline::before {
                left: 24px;
                transform: none
            }

            .row {
                display: block;
                min-height: 0;
                margin: 25px 0 45px;
                padding-left: 48px /* 手机版留出左边距 */
            }

            .left,
            .right {
                padding: 0;
                text-align: left
            }

            .empty {
                display: none
            }

            .node {
                position: absolute;
                left: 15px;
                top: 10px
            }

            .connector {
                display: none
            }

            .event {
                max-width: none
            }

            .major .event::after {
                left: 0 !important;
                right: auto !important;
                top: -20px !important;
                font-size: 70px !important;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-item">
                <div class="nav-jp">ホーム</div>
                <div class="nav-en">HOME</div>
            </div>
            <div class="nav-item">
                <div class="nav-jp">登場人物</div>
                <div class="nav-en">CHARACTER</div>
            </div>
            <div class="nav-item">
                <div class="nav-jp">相関図</div>
                <div class="nav-en">RELATIONSHIP</div>
            </div>
            <div class="nav-item">
                <div class="nav-jp">世界観</div>
                <div class="nav-en">BACKSTORY</div>
            </div>
            <div class="nav-item active">
                <div class="nav-jp">時間軸</div>
                <div class="nav-en">TIMELINE</div>
            </div>
        </nav><button class="mode" id="mode">DARK</button>
    </header>
    <section class="hero">
        <div class="kicker">ARCHIVE / CHRONOLOGY</div>
        <h1>HISTORY TIMELINE</h1>
        <p>同じ時代を生きた二つの軌跡を、一本の時間軸に記録する。</p>
    </section>
    
    <main class="timeline" id="timeline"></main>
    
    <footer class="footer">VERTICAL TIMELINE SAMPLE / 2026</footer>
    
    <script>
        // 优化点4：重构后的 JS 数据支持
        const data = [
            { type: "decade", text: "1950s" }, // 默认颜色
            { 
                date: "1957年", 
                title: "山陽熔接工業所 誕生", 
                text: "創業。最初期の事業基盤がここから始まる。", 
                side: "left" 
            },
            { type: "decade", text: "1960s" },
            { 
                date: "1962年", 
                title: "有限会社タクチ工業に組織変更", 
                text: "組織変更を行い、次の発展段階へ移行。", 
                side: "right" 
            },
            { type: "decade", text: "113年", color: "#5d82ff" }, // 独立自定义颜色演示
            {
                date: "N.F.113.3",
                title: "BR-002再爆発",
                text: "死者数は約3万人で、このうち一部は黒環の暴発そのものではなく、锈火暴動によって命を落としています。113年8月、FACが封鎖行動を開始する時点で、狂厄汚染の影響下にある人数はすでに17万人近くに達していました。",
                isMajor: true, // 触发背景大字
                side: "left"
            },
            {
                type: "image",
                src: "./img/timeline/113.jpg", // 仅作为占位预览，你可换成 './img/timeline/113.jpg'
                caption: "BR-002再爆発",
                side: "left"
            },
            {
                date: "N.F.113年6月",
                // 这里的 text 可以直接识别 <br> 标签换行
                text: "BR-002事件後、福音地の勢力は新城から撤退し、東区の混乱事件は減少、西区が主要な戦場となる。FACは黒環防衛陣線の構築を計画する。<br><br>福音地と上庭は互いにスパイを送り込んた。福音地はスパイを通じて上庭の秘密兵器「HUSH」システムの存在を知り、能力者組織「GARDEN」にその破壊を依頼するが、首领レオポルドに拒否される――彼女はより有利な介入のタイミングを待っている。<br><br>一方、HUSH部隊は福音地を掃除任務を受け、まず福音地と曖昧な関係を持つ能力者組織「GARDEN」を標的にした。HUSH部隊はHUSH-X（以下、X）の指揮下で「GARDEN」への破壊を開始。",
                side: "right"
            }
        ];

        function render() {
            const el = document.getElementById('timeline');
            el.innerHTML = '';
            
            // 自动交替左右逻辑，如果数据没提供 side 就自动算
            let currentSide = 'left'; 

            data.forEach(item => {
                // 渲染年份节点
                if (item.type === 'decade') {
                    const d = document.createElement('div');
                    d.className = 'decade';
                    // 如果传入了自定义 color 就行内替换，否则继承 CSS 的 #7a7a7a
                    const colorStyle = item.color ? ` style="color: ${item.color}"` : '';
                    d.innerHTML = `<span${colorStyle}>${item.text}</span>`;
                    el.appendChild(d);
                    return;
                }

                // 计算事件的靠左还是靠右
                const side = item.side || currentSide;
                currentSide = side === 'left' ? 'right' : 'left'; 

                const row = document.createElement('div');
                row.className = 'row' + (item.isMajor ? ' major' : '');

                let contentInner = '';

                if (item.type === 'image') {
                    // 图片类型的 DOM 结构
                    contentInner = `
                        <div class="event-image">
                            <img src="${item.src}" alt="${item.caption || ''}">
                        </div>
                        ${item.caption ? `<div class="event-desc" style="text-align:center; color:var(--muted)">▲ ${item.caption}</div>` : ''}
                    `;
                } else {
                    // 普通文本类型的 DOM 结构
                    const titleHTML = item.title ? `<div><span class="event-title">${item.title}</span></div>` : '';
                    const textHTML = item.text ? `<p class="event-desc">${item.text}</p>` : '';
                    
                    contentInner = `
                        ${item.date ? `<div class="event-date">${item.date}</div>` : ''}
                        ${titleHTML}
                        ${textHTML}
                    `;
                }

                // 处理背景大字：尝试提取年份文本如 "113" 或 "1985"
                let bgAttr = "";
                if (item.isMajor && item.date) {
                    const bgText = item.date.split(/[年]/)[0]; // 简单截取年字之前的内容
                    bgAttr = ` data-year="${bgText}"`;
                }

                const eventDOM = `<article class="event"${bgAttr}>${contentInner}</article>`;

                if (side === 'left') {
                    row.innerHTML = `<div class="side left">${eventDOM}</div><div class="node"></div><div class="side right empty"></div><div class="connector"></div>`;
                } else {
                    row.innerHTML = `<div class="side left empty"></div><div class="node"></div><div class="side right">${eventDOM}</div><div class="connector"></div>`;
                }
                
                el.appendChild(row);
            });
        }
        
        render();

        document.getElementById('mode').onclick = () => { 
            document.body.classList.toggle('dark'); 
            document.getElementById('mode').textContent = document.body.classList.contains('dark') ? 'LIGHT' : 'DARK' 
        };
    </script>
</body>

</html>
